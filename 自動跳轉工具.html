<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬用跳轉工具</title>
    <link rel="icon" href="https://s.pximg.net/www/js/fanbox/0896cd39e7c7fd62f3ae116926159da0.svg">
    <style>
        body {
            font-family: "SF Pro Display", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0;
            background-color: #0f1214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .container { text-align: center; pointer-events: none; z-index: 10; }
        .pixiv-logo {
            width: 120px; height: 120px;
            margin: 0 auto 30px auto;
            background-image: url('https://i.postimg.cc/9Q24Z9Yn/unnamed.webp');
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        h2 {
            font-size: 1.6rem; margin-bottom: 12px;
            background: linear-gradient(45deg, #0096fa, #00ffa3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hint-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888; font-size: 0.85rem; line-height: 1.6;
        }
        code { color: #0096fa; background: rgba(0, 150, 250, 0.1); padding: 2px 4px; border-radius: 4px; }
        body.drag-active { background-color: #162635; box-shadow: inset 0 0 100px rgba(0, 150, 250, 0.2); }
        body.drag-active::after {
            content: ""; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 3px dashed #0096fa; border-radius: 20px; opacity: 0.5;
        }
        body.drag-active .pixiv-logo { transform: scale(1.1) rotate(-3deg); }
    </style>
</head>
<body>

    <div class="container">
        <div class="pixiv-logo"></div>
        <h2>自動識別跳轉</h2>
        <div class="hint-box">
            把檔案丟進來即可跳轉<br>
            支援 <code>Pixiv (數字)</code> 與 <code>Iwara (英數混合)</code>
        </div>
    </div>

    <script>
        const body = document.body;

        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            body.classList.add('drag-active');
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            if (e.relatedTarget === null) body.classList.remove('drag-active');
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            body.classList.remove('drag-active');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const fileName = files[0].name;

                /**
                 * 1. 偵測 Iwara ID
                 * 邏輯：尋找包含大小寫英文+數字，且長度在 10-15 位之間的獨立區塊
                 * 使用 Lookbehind/Lookahead 確保它不是長字串的一部分
                 */
                const iwaraMatch = fileName.match(/(?:^|[^a-zA-Z0-9])([a-zA-Z0-9]{10,15})(?:[^a-zA-Z0-9]|$)/);
                
                // 排除純數字（避免跟 Pixiv 衝突）
                const isPureNumber = iwaraMatch && /^\d+$/.test(iwaraMatch[1]);

                /**
                 * 2. 偵測 Pixiv ID
                 * 邏輯：5-10 位純數字
                 */
                const pixivMatch = fileName.match(/(?:^|[^0-9])(\d{5,10})(?:[^0-9]|$)/);

                if (iwaraMatch && !isPureNumber) {
                    // 只要包含英文+數字混合，判定為 Iwara
                    const iwaraId = iwaraMatch[1];
                    window.location.href = `https://www.iwara.tv/video/${iwaraId}`;
                } else if (pixivMatch) {
                    // 純數字判定為 Pixiv
                    const pixivId = pixivMatch[1];
                    window.location.href = `https://www.pixiv.net/artworks/${pixivId}`;
                } else {
                    alert("無法識別此檔案！\n\n偵測到的檔名：\n" + fileName);
                }
            }
        });
    </script>
</body>
</html>
