<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixiv ID 萬用跳轉</title>
    <link rel="icon" href="https://i.postimg.cc/9Q24Z9Yn/unnamed.webp">
    <style>
        body {
            font-family: "SF Pro Display", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0;
            background-color: #0f1214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .container { text-align: center; pointer-events: none; z-index: 10; }
        .pixiv-logo {
            width: 120px; height: 120px;
            margin: 0 auto 30px auto;
            background-image: url('https://i.postimg.cc/9Q24Z9Yn/unnamed.webp');
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        h2 {
            font-size: 1.6rem; margin-bottom: 12px;
            background: linear-gradient(45deg, #fff, #aaa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hint-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        p { font-size: 0.95rem; color: #999; margin: 5px 0; }
        code { color: #0096fa; background: rgba(0, 150, 250, 0.1); padding: 2px 6px; border-radius: 4px; }
        body.drag-active { background-color: #162635; box-shadow: inset 0 0 100px rgba(0, 150, 250, 0.2); }
        body.drag-active::after {
            content: ""; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 3px dashed #0096fa; border-radius: 20px; opacity: 0.5;
        }
        body.drag-active .pixiv-logo { transform: scale(1.15) rotate(5deg); }
    </style>
</head>
<body>

    <div class="container">
        <div class="pixiv-logo"></div>
        <h2>Pixiv 自動跳轉</h2>
    </div>

    <script>
        const body = document.body;

        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            body.classList.add('drag-active');
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            if (e.relatedTarget === null) body.classList.remove('drag-active');
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            body.classList.remove('drag-active');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const fileName = files[0].name;
                
                // 強化版 Regex：尋找 5-9 位的獨立數字區塊
                const match = fileName.match(/(?:^|[^0-9])(\d{5,9})(?:[^0-9]|$)/);
                
                if (match) {
                    // match[1] 是括號中抓到的數字部分
                    const pixivId = match[1];
                    const url = `https://www.pixiv.net/artworks/${pixivId}`;
                    window.location.href = url;
                } else {
                    alert("識別失敗！檔名中找不到 5~9 位的 ID。\n檔名：" + fileName);
                }
            }
        });
    </script>
</body>
</html>
